<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logseq Copilot · Web</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif; max-width: 860px; margin: 0 auto; padding: 24px; color: #1a202c; background: #f7f7f5; }
    h1 { font-size: 20px; }
    .card { background: #fff; border: 1px solid #e2e2dc; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #718096; margin: 8px 0 4px; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; }
    button { padding: 8px 16px; border: none; border-radius: 6px; background: #4f46e5; color: #fff; font-size: 14px; cursor: pointer; }
    button.secondary { background: #718096; }
    .row { display: flex; gap: 8px; }
    .grow { flex: 1; }
    .page { margin: 4px 0; }
    .page a, .group-title a { color: #4f46e5; text-decoration: none; font-weight: 500; }
    .group { margin: 12px 0; }
    .group-title { font-size: 13px; color: #4a5568; font-weight: 600; margin-bottom: 6px; }
    .block { border-left: 3px solid #e2e2dc; padding-left: 12px; margin: 8px 0; font-size: 14px; line-height: 1.6; }
    .block .logseq-page-link { color: #4f46e5; text-decoration: none; }
    .err { color: #c53030; font-size: 13px; margin-top: 8px; }
    .meta { font-size: 12px; color: #a0aec0; margin-top: 8px; }
    ul { padding-left: 16px; }
  </style>
</head>
<body>
  <h1>Logseq Copilot · 独立 Web 渲染</h1>
  <div id="root"></div>
  <script src="./dist/main.js"></script>
</body>
</html>
